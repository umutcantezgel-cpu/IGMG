# Lokaler Helfer-Server der IGMG Wetzlar (ADR 0036): läuft neben Vercel, nie statt Vercel.
# Alles Kernhafte funktioniert auch ohne ihn (Abruf statt Echtzeit, täglicher Cron, Erinnerung im Browser).
#   docker compose up -d                    Sicherung, Probe, Takt, Überwachung, Medienspiegel
#   docker compose --profile echtzeit up -d zusätzlich Centrifugo + Caddy (nur mit öffentlicher Adresse, MN-12)
# Werte stehen in .env (Vorlage .env.beispiel); nie ins Repository.
# S3 (Sicherheitsprüfung): Jeder Dienst bekommt nur seine eigenen Werte (Compose liest .env nur zum Einsetzen) – das
# internetseitige Caddy und Centrifugo sehen weder den Datenbankzugang der Sicherung noch das Blob-Token oder SMTP.
name: igmg-lokal

x-standard: &standard
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: '5m', max-file: '3' }

services:
  takt:
    <<: *standard
    image: curlimages/curl:8.17.0
    entrypoint: ['/bin/sh', '/takt/takt.sh']
    environment:
      APP_URL: ${APP_URL:-}
      WARTUNG_TOKEN: ${WARTUNG_TOKEN:-}
    volumes:
      - ./takt:/takt:ro

  sicherung:
    <<: *standard
    build: ./sicherung
    command: ['/sicherung/zeitplan.sh']
    environment:
      APP_URL: ${APP_URL:-}
      WARTUNG_TOKEN: ${WARTUNG_TOKEN:-}
      SICHERUNG_DATABASE_URL: ${SICHERUNG_DATABASE_URL:-}
      AGE_EMPFAENGER: ${AGE_EMPFAENGER:-}
      SICHERUNG_TAGE: ${SICHERUNG_TAGE:-30}
    volumes:
      - ./sicherung:/sicherung:ro
      - sicherungen:/daten
      # Kein privater Schlüssel auf diesem Server (DSFA D-08): die Probe entschlüsselt nicht

  medien-spiegel:
    <<: *standard
    build: ./spiegel
    environment:
      APP_URL: ${APP_URL:-}
      WARTUNG_TOKEN: ${WARTUNG_TOKEN:-}
      BLOB_READ_WRITE_TOKEN: ${BLOB_READ_WRITE_TOKEN:-}
    volumes:
      - spiegel:/daten

  ueberwachung:
    <<: *standard
    build: ./ueberwachung
    environment:
      APP_URL: ${APP_URL:-}
      TECHNIK_MAIL: ${TECHNIK_MAIL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_ABSENDER: ${MAIL_ABSENDER:-}
    volumes:
      - ./ueberwachung:/ueberwachung:ro

  centrifugo:
    <<: *standard
    profiles: [echtzeit]
    image: centrifugo/centrifugo:v6.5.1
    command: ['centrifugo', '--config', '/centrifugo/config.json']
    environment:
      CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY:-}
      CENTRIFUGO_HTTP_API_KEY: ${CENTRIFUGO_HTTP_API_KEY:-}
      CENTRIFUGO_CLIENT_ALLOWED_ORIGINS: ${CENTRIFUGO_CLIENT_ALLOWED_ORIGINS:-}
    volumes:
      - ./echtzeit/centrifugo.json:/centrifugo/config.json:ro
    expose: ['8000']

  caddy:
    <<: *standard
    profiles: [echtzeit]
    image: caddy:2.10.2-alpine
    ports: ['80:80', '443:443']
    environment:
      ECHTZEIT_DOMAIN: ${ECHTZEIT_DOMAIN:-}
    volumes:
      - ./echtzeit/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-daten:/data
    depends_on: [centrifugo]

volumes:
  sicherungen:
  spiegel:
  caddy-daten:
